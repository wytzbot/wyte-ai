<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — WYTE AI</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
  .product-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .product-image { width: 100%; aspect-ratio: 1; background: var(--bg-soft); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; object-fit: cover; }
  .product-body { padding: 14px; }
  .product-name { font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
  .product-price { font-family: var(--font-mono); font-size: 15px; }
  .product-status { display: inline-block; margin-top: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
  .in-stock { background: var(--accent-tint); color: var(--accent-dark); }
  .out-of-stock { background: #f1f1ef; color: var(--text-muted); }
  .empty-state { text-align: center; padding: 60px 20px; background: #fff; border: 1px dashed var(--border); border-radius: var(--radius); margin-top: 20px; }
  .empty-state h3 { font-size: 17px; }
  @media (max-width: 860px) { .product-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <a href="/dashboard.html" class="logo"><span class="logo-dot"></span>WYTE AI</a>
    <a href="/settings.html" class="btn btn-secondary" style="padding:9px 16px; font-size:13.5px;">Sync catalog</a>
  </nav>

  <main class="app-main">
    <h1 style="font-size:22px;">Products</h1>
    <p id="syncSummary" style="font-size:13.5px;"></p>

    <div class="product-grid" id="productGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <h3>No products found yet 👗</h3>
      <p>Connect your WhatsApp catalog and we'll sync your products.</p>
      <a href="/settings.html" class="btn btn-primary">Connect Catalog</a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/dashboard.html">Home</a>
    <a href="/products.html" class="active">Products</a>
    <a href="/orders.html">Orders</a>
    <a href="/settings.html">Settings</a>
  </nav>
</div>
<script type="module" src="js/products.js"></script>
</body>
</html>
