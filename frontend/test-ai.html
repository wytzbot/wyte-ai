<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test AI — WYTE AI</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .test-shell { max-width: 520px; margin: 0 auto; }
  .test-chat {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; min-height: 320px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;
  }
  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1; padding: 12px 14px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 15px; font-family: var(--font-body); min-height: 44px;
  }
  .composer input:focus { border-color: var(--accent); outline: none; }
  .send-btn { border-radius: 999px; padding: 12px 20px; }
  .trace-box {
    background: #fff; border: 1px dashed var(--border); border-radius: var(--radius-sm);
    padding: 14px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-muted);
    margin-top: 14px; display: none;
  }
  .trace-box.visible { display: block; }
  .trace-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .usage-line { font-size: 13px; color: var(--text-muted); margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <a href="/dashboard.html" class="logo"><span class="logo-dot"></span>WYTE AI</a>
    <a href="/dashboard.html" class="btn btn-secondary" style="padding:9px 16px; font-size:13.5px;">Back to dashboard</a>
  </nav>

  <main class="app-main">
    <div class="test-shell">
      <h1 style="font-size:22px;">Test your AI</h1>
      <p>Try the kinds of questions your customers might ask. This uses your real synced catalog — if nothing's synced yet, you'll see how it handles that honestly.</p>

      <div class="test-chat" id="testChat"></div>

      <form class="composer" id="composerForm">
        <input type="text" id="messageInput" placeholder="e.g. How much is the blue gown?" autocomplete="off" required>
        <button type="submit" class="btn btn-primary send-btn" id="sendBtn">Send</button>
      </form>

      <div class="trace-box" id="traceBox">
        <div class="trace-row"><span>Detected intent</span><span id="traceIntent">—</span></div>
        <div class="trace-row"><span>Product matched</span><span id="traceProduct">—</span></div>
        <div class="trace-row"><span>Answered by</span><span id="traceSource">—</span></div>
      </div>
      <p class="usage-line" id="usageLine"></p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/dashboard.html">Home</a>
    <a href="/products.html">Products</a>
    <a href="/orders.html">Orders</a>
    <a href="/settings.html">Settings</a>
  </nav>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="js/test-ai.js"></script>
</body>
</html>
