<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — WYTE AI</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .customer-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 14px 16px; margin-bottom: 10px;
  }
  .customer-phone { font-family: var(--font-mono); font-size: 14px; }
  .customer-meta { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .customer-spend { font-family: var(--font-mono); font-size: 14px; text-align: right; }
  .empty-state { text-align: center; padding: 60px 20px; background: #fff; border: 1px dashed var(--border); border-radius: var(--radius); margin-top: 20px; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="app-nav">
    <a href="/dashboard.html" class="logo"><span class="logo-dot"></span>WYTE AI</a>
  </nav>

  <main class="app-main">
    <h1 style="font-size:22px;">Customers</h1>
    <p style="font-size:13.5px;">Everyone who's messaged your assistant on WhatsApp.</p>
    <div id="customerList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <h3>No customers yet</h3>
      <p>Once someone messages your connected WhatsApp number, they'll show up here.</p>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="/dashboard.html">Home</a>
    <a href="/products.html">Products</a>
    <a href="/orders.html">Orders</a>
    <a href="/settings.html">Settings</a>
  </nav>
</div>
<script type="module" src="js/customers.js"></script>
</body>
</html>
