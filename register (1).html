<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start free — WYTE AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="logo" style="margin-bottom:20px; display:flex;"><span class="logo-dot"></span>WYTE AI</a>
    <span class="progress-label">Step 1 of 10</span>
    <h1>Create your account</h1>
    <div class="form-error" id="formError"></div>
    <form id="registerForm" novalidate>
      <div class="field">
        <label for="businessName">Business name</label>
        <input type="text" id="businessName" name="businessName" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
