<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — WYTE AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <a href="/" class="logo" style="margin-bottom:20px; display:flex;"><span class="logo-dot"></span>WYTE AI</a>
    <h1>Welcome back</h1>
    <div class="form-error" id="formError"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log in</button>
    </form>
    <p class="auth-switch"><a href="/forgot-password.html">Forgot password?</a></p>
    <p class="auth-switch">Don't have an account? <a href="/register.html">Start free</a></p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
